<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Chat</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>KB Chat</h1>
            <div class="file-count-wrap">
                <span id="status" class="status"></span>
                <span id="file-count" class="file-count"></span>
                <div class="header-actions">
                    <button id="clear-btn" class="header-btn" type="button" title="Clear conversation">Clear</button>
                    <button id="reindex-btn" class="header-btn" type="button">Reindex</button>
                </div>
            </div>
        </header>

        <nav class="tabs">
            <button id="tab-chat" class="tab active">Chat</button>
            <button id="tab-files" class="tab">Files</button>
            <button id="tab-note" class="tab">Add Note</button>
            <button id="tab-upload" class="tab">Upload</button>
        </nav>

        <section id="pane-chat" class="pane chat-pane">
            <main id="messages" class="messages">
                <div id="empty-state" class="empty-state">
                    <p class="empty-title">Ask your knowledge base anything</p>
                    <div class="empty-hints">
                        <button type="button" class="hint-btn">Summarize my GC study files</button>
                        <button type="button" class="hint-btn">What do my notes say about Pyramix?</button>
                    </div>
                </div>
            </main>
            <form id="chat-form" class="chat-form" autocomplete="off">
                <input
                    id="question"
                    type="text"
                    placeholder="Ask your knowledge base..."
                    aria-label="Question"
                >
                <button type="submit" id="send-btn">Send</button>
            </form>
        </section>

        <section id="pane-files" class="pane files-pane hidden">
            <div class="files-toolbar">
                <input id="files-search" type="text" placeholder="Search files…" aria-label="Search files">
                <button id="files-refresh" class="files-refresh" type="button">Refresh</button>
            </div>
            <ul id="files-list" class="files-list"></ul>
        </section>

        <section id="pane-note" class="pane note-pane hidden">
            <form id="note-form" autocomplete="off">
                <label for="note-title">Title</label>
                <input id="note-title" type="text" placeholder="Note title (optional)">
                <label for="note-content">Note / Fact</label>
                <textarea id="note-content" rows="8" placeholder="Type your note or fact here..."></textarea>
                <button type="submit" id="note-btn">Save Note (.md)</button>
                <p id="note-result" class="result"></p>
            </form>
        </section>

        <section id="pane-upload" class="pane upload-pane hidden">
            <form id="upload-form">
                <label for="upload-file">File (PDF, DOCX, TXT, MD) — or drop it here</label>
                <input id="upload-file" type="file">
                <button type="submit" id="upload-btn">Convert &amp; Preview</button>
                <p id="upload-result" class="result"></p>
                <div id="upload-preview" class="upload-preview" hidden>
                    <p id="upload-preview-title" class="upload-preview-title"></p>
                    <pre id="upload-preview-content" class="upload-preview-content"></pre>
                    <button type="button" id="upload-save-btn" class="save-btn">Save to KB</button>
                </div>
            </form>
        </section>
    </div>

    <div id="file-modal" class="modal">
        <div class="modal-box">
            <header class="modal-head">
                <h2 id="file-path" class="modal-title"></h2>
                <button id="file-close-btn" class="modal-close" aria-label="Close">&times;</button>
            </header>
            <pre id="file-preview" class="file-preview" hidden></pre>
            <textarea id="file-content" class="file-content" spellcheck="false"></textarea>
            <footer class="modal-foot">
                <span id="file-msg" class="file-msg"></span>
                <div class="modal-actions">
                    <button id="file-delete-btn" class="delete-btn">Delete</button>
                    <button id="file-save-btn" class="save-btn">Save &amp; Reindex</button>
                </div>
            </footer>
        </div>
    </div>
    <script src="/static/render.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
